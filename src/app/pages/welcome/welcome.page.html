<ion-content class="welcome-content" [fullscreen]="true">

  <div class="welcome-wrap">
    <div class="left-panel">
      
      <!-- Centered Logo -->
      <img src="assets/icon/logo_design.png" class="logo-image" alt="StudyGroup Logo" />

      <!-- Updated Headline -->
      <h1 class="hero-headline">
        Welcome to <span>StudyGroup</span> </h1>

      <p class="hero-sub">
        Team up, share study materials, and stay completely synced. 
        <br> 
        Your all-in-one hub to ace your projects and exams together
      </p>

      <button class="get-started-btn" (click)="goToLogin()">
        Get Started 
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </button>

    </div>
  </div>

  <div class="welcome-footer">© All rights reserved || Salem Ghizlene ★</div>

</ion-content>
